name: E-01 validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate JavaScript syntax
        run: node --check server.js
      - name: Run backend tests
        run: npm test

  flutter:
    name: Flutter analysis, tests and web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run E-01 widget tests
        run: flutter test test/resumen_mensual_card_test.dart
      - name: Build web release
        run: flutter build web --release
